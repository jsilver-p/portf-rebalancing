org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
# parallel=false: Kotlin 플러그인이 병렬 실행에서 루트 프로젝트 상태 락과 충돌한다
# (실측: "Current thread does not hold the state lock for root project 'portf-edge'"
#  at :app:compileDebugKotlin). 모듈이 하나뿐이라 병렬로 얻는 것도 없다.
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
